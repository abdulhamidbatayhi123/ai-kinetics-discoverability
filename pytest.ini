# Run from the repository root:
#   python -m pytest                 the full suite (about 76 min in logs/pytest_p2.log)
#   python -m pytest -m "not slow"   without the ten slowest tests
[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
markers =
    slow: one of the ten slowest tests in logs/pytest_p2.log (66 s to 31 min each); deselect with -m "not slow"
